<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>JobCracker.in logo</title>
<desc>A bold logo featuring a stylised cracked shield with a lightning bolt, the wordmark JobCracker in deep blue, and .in in amber below</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <mask id="imagine-text-gaps-7pogh5" maskUnits="userSpaceOnUse">
    <rect x="0" y="0" width="680" height="320" fill="white"/>
    <rect x="286" y="81" width="133.0078125" height="84.5" fill="black" rx="2"/>
    <rect x="286" y="153" width="271.12109375" height="84.5" fill="black" rx="2"/>
    <rect x="312.66796875" y="242.5" width="26.6640625" height="22" fill="black" rx="2"/>
    <rect x="286" y="283.5" width="259.21875" height="22" fill="black" rx="2"/>
  </mask>
</defs>

<!-- SHIELD SHAPE -->
<g transform="translate(100, 40)">
  <path d="M80 0 L155 28 L155 110 Q155 175 80 210 Q5 175 5 110 L5 28 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <polyline points="80,30 72,80 88,88 68,170" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="88,88 108,95 95,130" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="72,80 52,90 60,115" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="90,50 70,105 82,105 72,160 102,95 88,95 100,50" fill="#EF9F27" stroke="#BA7517" stroke-width="1"/>
</g>

<!-- WORDMARK -->
<text x="290" y="148" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#0C447C" letter-spacing="-1">Job</text>
<text x="290" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#185FA5" letter-spacing="-1">Cracker</text>

<!-- Crack line through the wordmark divider -->
<polyline points="288,158 380,152 490,162 580,156 636,160" fill="none" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" mask="url(#imagine-text-gaps-7pogh5)"/>

<!-- .in domain tag -->
<rect x="290" y="238" width="72" height="32" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="326" y="259" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#633806" text-anchor="middle">.in</text>

<!-- Tagline -->
<text x="290" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#378ADD" letter-spacing="2">YOUR UNFAIR ADVANTAGE</text>

</svg>
